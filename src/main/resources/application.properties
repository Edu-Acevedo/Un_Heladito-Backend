spring.application.name=un-heladito-api
server.port=8081

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/un_heladito?serverTimezone=America/Santiago&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}
springdoc.swagger-ui.path=/swagger-ui.html
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=un-heladito-api
app.security.jwt.access-token-minutes=15
app.security.refresh-token-days=${REFRESH_TOKEN_DAYS:7}
app.security.cookie.secure=${AUTH_COOKIE_SECURE:false}
app.bootstrap.admin.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.bootstrap.admin.name=${ADMIN_BOOTSTRAP_NAME:}
app.bootstrap.admin.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.bootstrap.admin.password=${ADMIN_BOOTSTRAP_PASSWORD:}
app.bootstrap.catalogo.enabled=false